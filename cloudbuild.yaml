# Cloud Build configuration for GRC Guard AI
# Builds backend + frontend images, pushes to Artifact Registry, deploys to GKE

substitutions:
  _REGION: us-central1
  _REPO: grc-guard
  _GKE_CLUSTER: grc-guard-cluster
  _GKE_ZONE: us-central1

steps:
  # ── Step 1: Build backend Docker image ──
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:localbuild'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend/'

  # ── Step 2: Build frontend Docker image ──
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y29ycmVjdC1tYWxsYXJkLTk4LmNsZXJrLmFjY291bnRzLmRldiQ'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:localbuild'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest'
      - '-f'
      - 'frontend/Dockerfile.prod'
      - 'frontend/'

  # ── Step 3: Push both images to Artifact Registry ──
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend'
    waitFor:
      - 'build-backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend'
    waitFor:
      - 'build-frontend'

  # ── Step 4: Deploy to GKE ──
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'deploy-to-gke'
    args:
      - 'run'
      - '--filename=k8s/'
      - '--location=${_GKE_ZONE}'
      - '--cluster=${_GKE_CLUSTER}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:localbuild'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:localbuild'
    waitFor:
      - 'push-backend'
      - 'push-frontend'

# ── Images to be stored in Artifact Registry ──
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:localbuild'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:localbuild'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
