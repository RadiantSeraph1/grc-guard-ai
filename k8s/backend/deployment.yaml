apiVersion: apps/v1
kind: Deployment
metadata:
  name: grc-backend
  namespace: grc-guard
  labels:
    app.kubernetes.io/name: grc-guard
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: grc-guard
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grc-guard
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: grc-backend-ksa
      containers:
        # ── Backend Application Container ──
        - name: backend
          image: us-central1-docker.pkg.dev/claude-code-501412/grc-guard/backend:latest
          ports:
            - containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: grc-guard-config
            - secretRef:
                name: grc-guard-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

        # ── Cloud SQL Auth Proxy Sidecar ──
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "claude-code-501412:us-central1:grc-guard-db"
          ports:
            - containerPort: 5432
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            runAsNonRoot: true
