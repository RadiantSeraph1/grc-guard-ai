apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grc-backend-hpa
  namespace: grc-guard
  labels:
    app.kubernetes.io/name: grc-guard
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grc-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
