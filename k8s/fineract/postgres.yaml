apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fineract-postgres-pvc
  namespace: grc-guard
  labels:
    app.kubernetes.io/name: grc-guard
    app.kubernetes.io/component: fineract-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fineract-postgres
  namespace: grc-guard
  labels:
    app.kubernetes.io/name: grc-guard
    app.kubernetes.io/component: fineract-demo-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grc-guard
      app.kubernetes.io/component: fineract-demo-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grc-guard
        app.kubernetes.io/component: fineract-demo-db
    spec:
      containers:
        - name: postgres
          image: postgres:18.3
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: fineract-postgres-config
            - secretRef:
                name: fineract-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "root"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "root"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fineract-postgres-pvc
        - name: init-script
          configMap:
            name: fineract-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: fineract-postgres
  namespace: grc-guard
  labels:
    app.kubernetes.io/name: grc-guard
    app.kubernetes.io/component: fineract-demo-db
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grc-guard
    app.kubernetes.io/component: fineract-demo-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
