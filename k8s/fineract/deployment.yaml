# Apache Fineract, self-hosted in-cluster for demo/audit purposes only — this
# is the community's own dev/test image (not production-hardened; see
# https://hub.docker.com/r/apache/fineract). No ingress: only grc-backend
# reaches it, over the ClusterIP service, exactly as the report's "self-hosted
# core banking connector" scenario assumes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fineract
  namespace: grc-guard
  labels:
    app.kubernetes.io/name: grc-guard
    app.kubernetes.io/component: fineract-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grc-guard
      app.kubernetes.io/component: fineract-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grc-guard
        app.kubernetes.io/component: fineract-demo
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z fineract-postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: fineract
          image: apache/fineract:latest
          ports:
            - containerPort: 8443
          envFrom:
            - configMapRef:
                name: fineract-config
            - secretRef:
                name: fineract-secrets
          # First boot runs Liquibase migrations + seeds the default "mifos"
          # admin user; that takes minutes, hence the long initial delay.
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 180
            periodSeconds: 20
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 180
            periodSeconds: 20
            failureThreshold: 10
          resources:
            requests:
              memory: "768Mi"
              cpu: "150m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: fineract
  namespace: grc-guard
  labels:
    app.kubernetes.io/name: grc-guard
    app.kubernetes.io/component: fineract-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grc-guard
    app.kubernetes.io/component: fineract-demo
  ports:
    - name: https
      port: 8443
      targetPort: 8443
