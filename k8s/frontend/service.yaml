apiVersion: v1
kind: Service
metadata:
  name: grc-frontend
  namespace: grc-guard
  labels:
    app.kubernetes.io/name: grc-guard
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grc-guard
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
