server {
    listen 8080;
    location / {
        proxy_pass http://34.54.170.130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Default 60s is too short for slow-but-legitimate AI endpoints - the
        # multi-agent Brain chat and especially the real perturbation-based
        # LIME explainer (up to 16 sequential model calls) can run past it,
        # surfacing a raw 504 instead of a real response.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}